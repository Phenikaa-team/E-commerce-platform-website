<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>
  <!-- Background with subtle grid -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#subtleGrid)" />
  
  <!-- Center content -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Camera / Landscape Icon -->
    <rect x="-36" y="-55" width="72" height="50" rx="8" fill="#94A3B8" fill-opacity="0.35" stroke="#64748B" stroke-width="2.5" stroke-opacity="0.6" />
    <circle cx="0" cy="-30" r="14" fill="none" stroke="#64748B" stroke-width="2.5" stroke-opacity="0.6" />
    <circle cx="20" cy="-45" r="3" fill="#64748B" fill-opacity="0.6" />
    <path d="M -18 -55 L -10 -63 L 10 -63 L 18 -55 Z" fill="#94A3B8" fill-opacity="0.35" stroke="#64748B" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Neutral Label -->
    <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#475569" letter-spacing="1.5">STORE BANNER</text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">Kích thước tối ưu: 1200 × 320 px</text>
  </g>
</svg>
