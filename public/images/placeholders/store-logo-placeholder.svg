<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#logoBgGrad)" />
  
  <!-- Subtle circular border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#CBD5E1" stroke-width="2" />
  
  <!-- Store icon and text -->
  <g transform="translate(100, 95)" text-anchor="middle">
    <!-- Storefront Outline Icon -->
    <path d="M -30 -10 L 30 -10 L 30 -18 L -30 -18 Z" fill="#64748B" fill-opacity="0.8" />
    <path d="M -26 -10 L -26 25 L 26 25 L 26 -10 Z" fill="none" stroke="#64748B" stroke-width="3" stroke-linejoin="round" />
    <!-- Door -->
    <path d="M -9 25 L -9 6 L 9 6 L 9 25 Z" fill="#94A3B8" fill-opacity="0.4" stroke="#64748B" stroke-width="2.5" />
    <!-- Awning stripes -->
    <path d="M -34 -18 L 34 -18 L 26 -38 L -26 -38 Z" fill="#475569" />
    
    <!-- Label -->
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" letter-spacing="1">STORE LOGO</text>
  </g>
</svg>
